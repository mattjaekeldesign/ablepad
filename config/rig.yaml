# config/rig.yaml — the rig's single configuration file.
#
# NOT the same thing as configs/ (the Config Lab's mode-layout JSON). This file is
# machine/deployment truth; configs/ is UI design. They merge no earlier than Phase 3.
#
# Values marked UNVERIFIED are placeholders awaiting tools/rig_survey.py output from
# the Beelink. Replace them with measured values WITH their provenance headers, and
# delete the UNVERIFIED tag as each lands. storage/config_loader.py validates shape
# and ranges, but it cannot know a wrong path from a right one — only the survey can.

rig:
  name: liverig
  tick_hz: 30            # MEASURED 2026-08-12: 899 consecutive ticks, zero overruns,
                         # each one rendering and pushing all 81 LEDs on the Beelink
  boot_timeout_s: 90     # how long the boot gate waits before showing Error Mode
  boot_choice_s: 8      # Seconds of Set Browser before the default set loads itself.
                        # OBSERVED on the first cold boot 2026-08-13: the rig
                        # launched boot_set instantly and by the time a human was
                        # looking the surface already belonged to Ableton, so the
                        # browser existed at boot and was unreachable at boot.
                        # It does NOT wait for input -- a rig powering up in a van
                        # must reach a playable state with nobody there. 0 = off.
  boot_requires_choice: true
                        # WAIT at the Set Browser until a set is chosen; never load
                        # boot_set on a timer. "live launched auto which is a big
                        # no... i must be able to choose the set i want to boot
                        # into" -- launching the WRONG set is worse than launching
                        # nothing. Cost: a rig powering up unattended sits at the
                        # browser forever. false restores the boot_choice_s timeout.
  boot_floor_s: 8        # FLOOR, measured from launch. A Remote Script readiness
                         # signal is ignored until this has passed.
                         # MEASURED 2026-08-13 on test.als (Gateway with a NAM model
                         # and IR loaded -- the plugin state is an opaque VST3 blob,
                         # so the set looks empty in the XML and is not):
                         #     asio    4.03 s
                         #     signal  4.61 s   <- fires before the set is up
                         #     window  6.25 s   <- Live's UI exists here
                         # The signal is optimistic by 1.6 s, which is exactly why
                         # this floor exists. Was 5, which completed boot 1.25 s
                         # BEFORE Live had a window; 8 covers the last marker with
                         # margin. tools/measure_load.py reproduces this.
                         #
                         # VERIFIED BY EAR 2026-08-13: a guitar note played the
                         # instant the Launchpad entered Set Browser spoke cleanly,
                         # no stumble. That is the only test that proves anything --
                         # every marker above is a proxy, and none of them can tell
                         # silence from sound. Re-run it after any change to the
                         # performance set, and raise this number rather than chase
                         # the signal if the first note ever stumbles.
  boot_settle_s: 25      # NOW A FALLBACK, not the normal path. With the Ablepad
                         # Remote Script installed, boot completes on Live's own
                         # confirmation instead -- MEASURED 2026-08-13: 5.03 s from
                         # launch to boot complete, against 25 s before, and the 5 s
                         # was boot_floor_s rather than the signal being slow.
                         # A boot that takes the full 25 s again means the signal
                         # stopped arriving: check the Remote Script survived a Live
                         # update (tools/install-remote-script.ps1). The boot log
                         # names which of the two paths was taken.
                         #
                         # Still a guess, now with one measurement against it:
                         # MEASURED 2026-08-13, the emergency set had Ableton bound
                         # to the EVO's ASIO driver 4.1 s after launch, so 21 s of
                         # this was dead wait. DO NOT lower it to match -- that set
                         # is empty. Re-measure with the REAL performance set, which
                         # loads a NAM model and IRs, and use that plus margin.
                         # tools/results/cold-boot.txt

launchpad:
  brightness: 40         # UNVERIFIED sane-guess. Manual p.5: low brightness may be
                         # REQUIRED for the device to power on at all. Tune at bench.
  port_contains: "2 (LPX MIDI)"

  # Hand the Launchpad to Ableton once a set is up, so it works as a normal Live
  # controller and the rig's system pads get out of the way. The rig takes it back
  # when Live exits, and STEALS it back for Error Mode -- silence has to be visible.
  #
  # REQUIRES a manual step the rig cannot perform or verify:
  #   Live -> Preferences -> Link, Tempo & MIDI -> Control Surface: Launchpad X
  #   Input / Output: the LPX ports WITHOUT "MIDIIN2"/"MIDIOUT2" in the name.
  #
  # That last part is the trap. Windows exposes four LPX ports; interface 1 is the
  # DAW port Live wants, interface 2 is the rig's (see port_contains above). Giving
  # Live interface 2 puts both on the same port and they will fight.
  #
  # false = the rig keeps the surface at all times (behaviour before 2026-08-13).
  handover_to_ableton: true
  # MEASURED 2026-08-12. Windows reports four ports, ALL containing "LPX":
  #   interface 1 (DAW) : 'LPX MIDI 0'            'LPX MIDI 1'
  #   interface 2 (MIDI): 'MIDIIN2 (LPX MIDI) 1'  'MIDIOUT2 (LPX MIDI) 2'
  # Programmer Mode lives on interface 2, so "LPX" alone is AMBIGUOUS -- it matches
  # all four. "2 (LPX MIDI)" is carried by both interface-2 ports and neither
  # interface-1 port.
  # KNOWN LIMITATION: one substring cannot express "the second USB interface".
  # Phase 3's ports.py should use the interface-number logic already proven in
  # tools/_bench.py rather than this string. See docs/launchpad-x-sysex.md section 1b.

audio_interface:
  match_any:
    # MEASURED 2026-08-12. "EVO 8" NEVER MATCHED ANYTHING -- Windows reports the
    # device as "Audient EVO8", closed up. The manual's names (p.14/p.36) do not
    # exist on Windows at all. tools/results/interface-names-evo8.txt
    - "Audient EVO8"
  require_status: "OK"   # presence only; an ESD-wedged EVO still reads OK (manual p.10)

ableton:
  # MEASURED 2026-08-12. Note ProgramData, not Program Files -- a guess would be wrong.
  exe: "C:\\ProgramData\\Ableton\\Live 12 Suite\\Program\\Ableton Live 12 Suite.exe"
  sets_dir: "C:\\LiveRig\\Sets"                                           # roadmap §8 tree
  # Launched at boot so the rig reaches a usable state before anyone picks a set.
  # EMPTY until a real .als exists -- with no boot set the rig will not start
  # Ableton itself, and boot completes only if something else already did.
  # MEASURED path 2026-08-13. Ableton nests a saved set inside a "<name> Project"
  # folder, so the .als is one level deeper than where you saved it.
  boot_set: "C:\\LiveRig\\Sets\\Candidate\\test Project\\test.als"

  # Where the Ablepad Remote Script writes "this set is loaded" (see
  # remote_script/README.md). The rig clears it before every launch, so anything
  # present afterwards belongs to the set now loading. Empty disables the signal and
  # boot falls back to waiting out rig.boot_settle_s.
  ready_signal_path: "C:\\LiveRig\\Logs\\ableton-ready.json"

  # Live's crash journal. MEASURED 2026-08-13 (Live 12.4.3): every run writes
  # <appdata>\Live <version>\Preferences\Crash\<stamp>_{BaseFiles,Undo}, and a
  # clean exit removes it. One left behind at startup is what makes Live ask
  # "recover the last session?" -- a modal dialog, and the rig has no keyboard.
  #
  # The version segment is globbed, so a Live update does not silently break this.
  # Journals are MOVED to the quarantine below, never deleted: this machine also
  # builds sets, and a journal can hold the only copy of unsaved work.
  #
  # Set to the user the scheduled task runs as. NOT read from %APPDATA% at runtime,
  # because that resolves against whoever launched the process.
  appdata_dir: "C:\\Users\\rigma\\AppData\\Roaming\\Ableton"
  crash_quarantine_dir: "C:\\LiveRig\\Logs\\crash-quarantine"

network:
  # The way back IN when everything else has failed. MEASURED 2026-08-13: this
  # Beelink's Intel AX101 reports "Hosted network supported: No", so it cannot BE an
  # access point without an internet connection to share. The phone makes the
  # network instead and the rig joins it -- an iPhone Personal Hotspot gives a LAN
  # with cellular data off, which is all VNC and SSH need.
  #
  # Windows auto-connect alone was NOT enough: with the profile set to connect
  # automatically and first in preference order, a hotspot switched off and on was
  # not rejoined. Windows rescans on its own schedule, and iOS sleeps Personal
  # Hotspot until something tries to associate. So the rig knocks, on this interval,
  # and ONLY while it has no network at all -- a working connection is never touched.
  #
  # Empty disables it. Join the network once by hand first (the password is not
  # stored here): tools\wifi_lifeline.py --auto "<ssid>"
  # RE-ENABLED 2026-08-13 with the grace period and backoff in place.
  #
  # The reason it exists, stated plainly: iOS Personal Hotspot SLEEPS when idle. It
  # stops broadcasting, so the Beelink cannot see it, so it cannot join, so nothing
  # wakes it -- a deadlock that presents as "sometimes it auto-connects and
  # sometimes it does not". Apple devices escape it via Instant Hotspot; a Windows
  # PC has no equivalent. A directed connect attempt names the SSID, which is the
  # one thing that can reach a hotspot that is not beaconing.
  #
  # It was briefly SUSPECTED of stranding the rig off-network. Unproven, and the
  # aggressive behaviour behind that suspicion is gone: 60 s of grace before the
  # first attempt so Windows can recover on its own, then backoff to 300 s.
  lifeline_ssid: "Trailmix"
  retry_interval_s: 20

logging:
  dir: "logs"
  level: "INFO"
